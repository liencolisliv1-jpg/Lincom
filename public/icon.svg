<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Green Swirl Gradients for Transparent Light Background -->
    <linearGradient id="greenGradMain" x1="180" y1="280" x2="490" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00C853" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>
    <linearGradient id="greenGradShade" x1="200" y1="240" x2="450" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#22C55E" />
      <stop offset="60%" stopColor="#059669" />
      <stop offset="100%" stopColor="#065F46" />
    </linearGradient>

    <!-- Vibrant Gold/Yellow Swirl Gradients -->
    <linearGradient id="goldGradMain" x1="530" y1="280" x2="840" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="40%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#D97706" />
