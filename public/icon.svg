    <linearGradient id="goldGradShade" x1="570" y1="240" x2="820" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FCD34D" />
      <stop offset="60%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
  </defs>

  <!-- Left Green Infinity Loop Swirls (Transparent / Light Mode) -->
  <g>
    <path d="M 370 245 C 220 245 188 360 188 455 C 188 550 250 610 370 610 C 465 610 500 540 512 485 C 475 545 425 575 365 575 C 275 575 240 520 240 455 C 240 385 285 300 370 300 C 445 300 482 370 512 425 C 475 320 435 245 370 245 Z" fill="url(#greenGradMain)" />
    <path d="M 360 270 C 255 270 215 355 215 450 C 215 525 260 575 345 575 C 410 575 450 530 480 475 C 455 505 410 535 355 535 C 285 535 258 485 258 440 C 258 375 300 315 375 315 C 415 315 448 340 475 385 C 445 310 405 270 360 270 Z" fill="url(#greenGradShade)" opacity="0.95" />
  </g>

  <!-- Right Gold/Yellow Infinity Loop Swirls -->
  <g>
    <path d="M 654 245 C 804 245 836 360 836 455 C 836 550 774 610 654 610 C 559 610 524 540 512 485 C 549 545 599 575 659 575 C 749 575 784 520 784 455 C 784 385 739 300 654 300 C 579 300 542 370 512 425 C 549 320 589 245 654 245 Z" fill="url(#goldGradMain)" />
    <path d="M 664 270 C 769 270 809 355 809 450 C 809 525 764 575 679 575 C 614 575 574 530 544 475 C 569 505 614 535 669 535 C 739 535 766 485 766 440 C 766 375 724 315 649 315 C 609 315 576 340 549 385 C 579 310 619 270 664 270 Z" fill="url(#goldGradShade)" opacity="0.95" />
  </g>

  <!-- Central Authentic White 3D Box with Dark Outline -->
  <g transform="translate(422, 322)">
    <!-- Isometric White Parcel Box -->
    <polygon points="90,0 180,48 90,96 0,48" fill="#FFFFFF" stroke="#0F172A" stroke-width="8" stroke-linejoin="round" />
    <polygon points="0,48 90,96 90,192 0,144" fill="#F8FAFC" stroke="#0F172A" stroke-width="8" stroke-linejoin="round" />
    <polygon points="90,96 180,48 180,144 90,192" fill="#E2E8F0" stroke="#0F172A" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Dark Navy Tape Strip -->
    <polygon points="60,16 120,48 120,192 60,160" fill="#0F172A" opacity="0.95" />
  </g>

  <!-- Authentic Wordmark "LIENCOLIS" Dark Navy for Light Mode -->
  <text 
    x="512" 
    y="760" 
    text-anchor="middle" 
    fill="#0F172A" 
    font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" 
    font-size="92" 
    font-weight="900" 
    letter-spacing="6"
  >
    LIENCOLIS
  </text>
