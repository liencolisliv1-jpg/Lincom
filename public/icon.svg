<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#334155" stroke-width="6" />

  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Benin Flag accent strip -->
  <g transform="translate(206, 68)">
    <rect x="0" y="0" width="32" height="12" rx="4" fill="#10B981" />
    <rect x="34" y="0" width="32" height="12" rx="4" fill="#F59E0B" />
    <rect x="68" y="0" width="32" height="12" rx="4" fill="#EF4444" />
  </g>

  <!-- Pin / Courier Shield -->
  <path d="M256 120 C185 120 128 177 128 248 C128 340 256 424 256 424 C256 424 384 340 384 248 C384 177 327 120 256 120 Z" 
        fill="url(#amberGrad)" 
        filter="url(#glow)" />

  <!-- Inner Dark Core -->
  <circle cx="256" cy="240" r="70" fill="#0B192C" />

  <!-- Fast Courier Lightning / Navigation Arrow -->
  <path d="M265 190 L225 245 L255 245 L240 290 L290 235 L260 235 Z" fill="#FBBF24" />

  <!-- Brand Wordmark at Bottom -->
  <text x="256" y="468" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4">LIENCOLIS</text>
</svg>
